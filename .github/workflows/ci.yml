name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by release.yml before publishing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync python -c "import httpx, pydantic; print(httpx.__version__, pydantic.VERSION)"
      - run: uv run --no-sync pytest

  # Generated models lean on pydantic behaviour that has changed between minor versions:
  # typed clients failed on 2.1–2.5 while the newest (test) and the floor (lowest-dependencies)
  # both passed. So run the suite on the newest patch of every minor between them. When a new
  # pydantic minor comes out, the test job picks it up; add the one it replaced here.
  pydantic-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ["2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "2.12", "2.13"]
    name: pydantic ${{ matrix.pydantic }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "pydantic==${{ matrix.pydantic }}.*"
      - run: uv run --no-sync python -c "import pydantic; print(pydantic.VERSION)"
      - run: uv run --no-sync pytest

  without-pydantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv pip uninstall pydantic
      # tests of the pydantic-backed layers skip themselves; the rest must pass without it
      - run: uv run --no-sync pytest
