name: Release

# Every push to main is a release. CI runs first; then scripts/next_release.py works out the
# version from the conventional commits since the last tag (feat: minor, ! or BREAKING CHANGE:
# major, anything else: patch), and the commit is tagged, built (hatch-vcs reads the version
# from the tag), published to PyPI and given a GitHub release with notes from those commits.
# Every step skips what's already done, so rerunning a failed release finishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/apiroute/
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit and tag, for the version
      - uses: astral-sh/setup-uv@v6

      - name: Work out the version
        run: |
          version=$(python3 scripts/next_release.py)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          python3 scripts/next_release.py --notes > "$RUNNER_TEMP/notes.md"

      - name: Tag
        run: |
          if [ -z "$(git tag --points-at HEAD --list "$TAG")" ]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: |
          if curl -sf "https://pypi.org/pypi/apiroute/$VERSION/json" > /dev/null; then
            echo "apiroute $VERSION is already published"
          else
            uv publish --trusted-publishing always
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
