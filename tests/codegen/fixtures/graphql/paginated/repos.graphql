# The signed-in user's repositories, every page.
query Repos($after: String) {
  viewer {
    login
    repos: repositories(first: 20, after: $after) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      totalCount
      nodes {
        name
        stargazerCount
      }
    }
  }
}

# The same through edges.
query RepoEdges($after: String) {
  viewer {
    repositories(first: 20, after: $after) @paginate {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          name
        }
      }
    }
  }
}
