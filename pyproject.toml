[project]
name = "apiroute"
version = "0.1.0.dev0"
description = "Build API clients declaratively: one @route per endpoint, safe defaults, httpx underneath."
readme = "README.md"
license = "MIT"
authors = [{ name = "Doug Youch", email = "dougyouch@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pydantic>=2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
