[project]
name = "apiroute"
version = "1.2.1"
description = "Build API clients declaratively: one @route per endpoint, safe defaults, httpx underneath."
readme = "README.md"
license = "MIT"
authors = [{ name = "Doug Youch", email = "dougyouch@gmail.com" }]
requires-python = ">=3.10"
keywords = ["api", "client", "http", "httpx", "rest", "declarative", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dougyouch/apiroute"
Repository = "https://github.com/dougyouch/apiroute"
Issues = "https://github.com/dougyouch/apiroute/issues"
Changelog = "https://github.com/dougyouch/apiroute/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pydantic = [
    "pydantic>=2",
]
soap = [
    "defusedxml>=0.7",
]
codegen = [
    "defusedxml>=0.7",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
apiroute = "apiroute.codegen.cli:main"

[dependency-groups]
dev = [
    "defusedxml>=0.7",
    "pydantic>=2",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
